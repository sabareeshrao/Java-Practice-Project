name: One-time lesson redundancy repair
on:
  push:
    paths:
      - scripts/fix-lesson-redundancy.cjs
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite redundant lesson text
        run: node scripts/fix-lesson-redundancy.cjs
      - name: Refresh generated question index
        run: python tools/build_question_index.py
      - name: Verify redundancy guard
        run: node scripts/audit-lesson-redundancy.cjs
      - name: Commit repaired curriculum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/lessons simulation/OPTION_B_EXPLANATION_TEXTS.md simulation/REDUNDANCY_AUDIT_REPORT.md QUESTION_INDEX.html QUESTION_INDEX.md docs/COVERAGE.md interview/resolved-mappings.json
          if git diff --cached --quiet; then
            echo "No repair changes produced"
            exit 0
          fi
          git commit -m "Rewrite redundant lesson questions and info text"
          git push origin HEAD:main
