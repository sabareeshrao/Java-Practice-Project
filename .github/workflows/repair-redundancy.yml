name: One-time lesson redundancy repair
on:
  push:
    paths:
      - scripts/run-semantic-repair.flag
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite redundant lesson text
        run: node scripts/fix-lesson-redundancy.cjs
      - name: Refresh generated question index
        run: python tools/build_question_index.py
      - name: Verify redundancy guard
        run: node scripts/audit-lesson-redundancy.cjs
      - name: Preview rewritten lessons
        run: |
          node -e 'for (const n of [4,12,73,93,118,145,160]) { const f=`simulation/lessons/${String(n).padStart(4,"0")}.json`; const l=require(`./${f}`); console.log(`=== L${n} ${l.title} ===`); l.steps.forEach((s,i)=>console.log(`S${i+1}\nQ: ${s.question}\nTE: ${s.why_te}\n`)); }'
