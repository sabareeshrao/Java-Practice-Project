spring:
  application:
    name: aerotopo
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:./data/aerotopo;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
survey:
  max-points: 20000
  vertical-tolerance: 0.15
  srid: 32644
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
logging:
  pattern:
    level: '%5p [survey:%X{requestId}]'
